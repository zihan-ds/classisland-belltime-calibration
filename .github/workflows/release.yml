name: Release

# 分支构建：main 上改动 plugin/** 时只验证「能不能打包」，不发 Release。
# Tag 构建：tag 严格为 a.b.c.d（ClassIsland 插件市场的要求）时构建并发布 Release，
#           Release 正文里会带上打包目标自动生成的 CLASSISLAND_PKG_MD5 注释（市场索引需要）。
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/release.yml'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cipx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 构建并一键打包 .cipx
        run: dotnet build plugin/BellTimeCalibration.csproj -c Release -p:CreateCipx=true

      - name: 校验打包产物
        shell: pwsh
        run: |
          $cipx = 'plugin/cipx/BellTimeCalibration.cipx'
          if (-not (Test-Path $cipx)) { throw "未生成 $cipx" }
          Get-ChildItem plugin/cipx | Select-Object Name, Length | Format-Table -AutoSize
          $md5 = (Get-FileHash $cipx -Algorithm MD5).Hash
          if (-not (Select-String -Path plugin/cipx/checksums.md -SimpleMatch $md5 -Quiet)) {
            throw "checksums.md 中找不到 cipx 的 MD5（$md5）"
          }
          "cipx MD5 = $md5"

      - name: 分支构建仅上传产物供人工检查
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: BellTimeCalibration-cipx
          path: plugin/cipx/BellTimeCalibration.cipx

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # Release 正文 = CHANGELOG.md 里本版本的小节：小节标题是 "## v$tag · 日期"，
          # 而 Release 标题已经是 v$tag，所以丢掉标题行，只取小节正文直到下一个 "## " 小节；
          # 末尾必须保留 CLASSISLAND_PKG_MD5 注释，插件市场索引依赖它。
          $md5Comment = (Get-Content plugin/cipx/checksums.md -Raw).Trim()
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $start = ($lines | Select-String -SimpleMatch "## v$tag" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md 里找不到 v$tag 的小节，Release 正文无法生成" }
          $body = @($lines[$start..($lines.Count - 1)])
          $next = ($body | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          if ($next) { $body = @($body[0..($next - 2)]) }
          $text = (@($body) -join "`n").TrimEnd()
          Set-Content -Path release-body.md -Value ($text + "`n" + $md5Comment) -Encoding utf8NoBOM
          gh release create $tag plugin/cipx/BellTimeCalibration.cipx --title "v$tag" --notes-file release-body.md
